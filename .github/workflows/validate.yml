name: Validate WRDS skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.15"
          python-version: "3.12"
          enable-cache: false
      - name: Validate skills, agents and references
        run: uv run --no-project --with pyyaml python scripts/validate_toolkit.py
      - name: Validate catalog and isolated installation
        run: uv run --no-project python scripts/validate_skill_catalog.py --output "$RUNNER_TEMP/wrds-catalog-validation.json"
